[project]
name = "cricpulse"
version = "0.1.0"
description = "CricPulse — Serverless Cricket Lakehouse & Ingestion Pipeline"
authors = [{ name = "KaizenCodes" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "structlog>=24.4.0",
    "sqlglot>=26.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
