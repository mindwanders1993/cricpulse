services:
  api:
    build: .
    entrypoint: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8081:8080"  # host:container — container port matches Cloud Run; host port avoids local collisions
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ingest:
    build: .
    # Default image ENTRYPOINT/CMD already run the ingestion pipeline.
    profiles: ["ingest"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
